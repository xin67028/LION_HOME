<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>断信长续</title>
    <style>
        /* ================= 核心重置与色彩 ================= */
        :root {
            --bg-color: #f5f5f5;
            --text-color: #333333;
            --ui-color: rgba(153, 153, 153, 0.6);
            --font-family: "Songti SC", "SimSun", serif;
        }

        body.theme-dark { --bg-color: #121212; --text-color: #e0e0e0; --ui-color: rgba(102, 102, 102, 0.6); }
        body.theme-botanical { --bg-color: #1a2419; --text-color: #d1dfc7; --ui-color: rgba(91, 116, 84, 0.6); }
        body.theme-macondo { --bg-color: #d7cdba; --text-color: #4a3e2f; --ui-color: rgba(156, 142, 118, 0.6); }
        body.theme-steppenwolf { --bg-color: #1c2127; --text-color: #b0c4de; --ui-color: rgba(79, 96, 117, 0.6); }

        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-family); transition: background-color 1.2s ease, color 1.2s ease;
        }

        body.hide-timestamps .timestamp { display: none !important; }

        /* ================= 全屏特效渲染层 ================= */
        #fx-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; }

        /* ================= UI 布局层 ================= */
        .ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; height: 100%; width: 100%; }

        header {
            width: 95%; max-width: 1200px; padding: 15px 0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .controls-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}

        button, select {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--ui-color);
            color: var(--text-color); padding: 6px 12px; cursor: pointer; border-radius: 4px;
            font-family: inherit; font-size: 13px; transition: all 0.3s ease; backdrop-filter: blur(2px); outline: none;
        }
        button:hover, select:hover { border-color: var(--text-color); }
        select { appearance: none; padding-right: 20px; }

        /* 书页导航专属样式 */
        .page-nav { display: flex; align-items: center; background: rgba(0,0,0,0.03); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--ui-color); }
        body.theme-dark .page-nav, body.theme-botanical .page-nav, body.theme-steppenwolf .page-nav { background: rgba(255,255,255,0.05); }
        #page-selector { border: none; background: transparent; font-weight: bold; padding: 4px 20px 4px 4px; font-size: 14px;}
        #new-page-btn { border: none; background: transparent; font-size: 16px; padding: 0 4px; color: var(--ui-color); }
        #new-page-btn:hover { color: var(--text-color); transform: scale(1.1); }
        .divider { color: var(--ui-color); margin: 0 5px; opacity: 0.5; }

        .toggle-label { font-size: 13px; color: var(--text-color); display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 0 5px; opacity: 0.8; transition: opacity 0.3s; }
        .toggle-label:hover { opacity: 1; }

        main { flex: 1; width: 90%; max-width: 700px; display: flex; flex-direction: column; padding-bottom: 20px; }

        textarea {
            flex: 1 1 auto; width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-color); font-size: 20px; line-height: 2;
            font-family: inherit; resize: none; padding: 20px 0; text-shadow: 0 0 3px var(--bg-color); transition: opacity 0.3s;
        }

        .archive-controls { display: flex; justify-content: flex-end; padding: 5px 0; border-bottom: 1px dashed var(--ui-color); margin-bottom: 15px; min-height: 30px; }
        #manual-archive-btn { display: none; }

        .dissolving { animation: slowDissolve 2.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; pointer-events: none; }
        @keyframes slowDissolve { 0% { opacity: 1; filter: blur(0px); transform: translateY(0); letter-spacing: normal; } 100% { opacity: 0; filter: blur(6px); transform: translateY(-30px); letter-spacing: 4px; } }

        #archive-wall {
            flex: 0 0 35%; overflow-y: auto; padding-top: 15px; padding-bottom: 30px;
            font-size: 15px; color: var(--ui-color); line-height: 1.8;
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); pointer-events: auto;
        }
        #archive-wall::-webkit-scrollbar { width: 4px; }
        #archive-wall::-webkit-scrollbar-thumb { background: var(--ui-color); border-radius: 2px; }

        .fragment { margin-bottom: 20px; padding-left: 15px; border-left: 1px solid var(--ui-color); animation: floatUp 1s ease-out; display: flex; flex-direction: column; }
        @keyframes floatUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .timestamp { font-size: 12px; font-family: monospace; opacity: 0.5; align-self: flex-end; margin-top: 8px; letter-spacing: 1px; transition: opacity 0.3s;}

        /* 特效动画 */
        .fx-color-dot { position: absolute; border-radius: 50%; opacity: 0.8; animation: popDot 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes popDot { 0% { transform: scale(0); opacity: 0.8; } 100% { transform: scale(3.5) translateY(-30px); opacity: 0; } }
        .fx-static-star { position: absolute; background: white; border-radius: 50%; animation: twinkle 4s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.1; } 100% { opacity: 0.9; box-shadow: 0 0 6px white; } }
        .fx-leaf { position: absolute; opacity: 0; border-radius: 0 80% 0 80%; animation: growLeaf 3.5s ease-out forwards; }
        @keyframes growLeaf { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 25% { opacity: 0.7; } 100% { transform: scale(1.8) rotate(45deg); opacity: 0; } }
        .fx-yellow-flower { position: absolute; font-size: 24px; filter: drop-shadow(0 0 3px rgba(212, 175, 55, 0.6)); animation: fallFlower 8s linear forwards; }
        @keyframes fallFlower { 0% { transform: translateY(-30px) rotate(0deg) scale(0.6); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(50vh) rotate(180deg) scale(1.2); opacity: 0; } }
        .fx-snow { position: absolute; background: #fff; border-radius: 50%; filter: blur(0.5px); animation: fallSnow linear forwards; }
        @keyframes fallSnow { 0% { transform: translateY(0) translateX(0); opacity: 0;} 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(100vh) translateX(30px); opacity: 0; } }
    </style>
</head>
<body class="theme-light">

    <div id="fx-layer"></div>

    <div class="ui-layer">
        <header>
            <div class="controls-group">
                <div class="page-nav">
                    <select id="page-selector" title="切换书页"></select>
                    <button id="new-page-btn" title="新建书页">➕</button>
                </div>
                <span class="divider">|</span>
                
                <select id="theme-selector">
                    <option value="theme-light">极简白</option>
                    <option value="theme-dark">深夜黑</option>
                    <option value="theme-botanical">植物园</option>
                    <option value="theme-macondo">马孔多</option>
                    <option value="theme-steppenwolf">荒原狼</option>
                </select>
                
                <select id="audio-selector">
                    <option value="none">静音</option>
                    <option value="custom-rain">雨声</option>
                    <option value="custom-fire">炉火</option>
                    <option value="import-local">本地导入</option>
                </select>
                <button id="play-audio-btn">播放环境音</button>
                <input type="file" id="local-music-input" accept="audio/*" style="display: none;">
            </div>
            
            <div class="controls-group">
                <label class="toggle-label"><input type="checkbox" id="animation-toggle" checked> 动画特效</label>
                <label class="toggle-label"><input type="checkbox" id="auto-archive-toggle" checked> 随机归档</label>
                <label class="toggle-label"><input type="checkbox" id="timestamp-toggle" checked> 时间邮戳</label>
                <button id="download-btn">封存信件 (TXT)</button>
            </div>
        </header>

        <main>
            <textarea id="zen-input" placeholder="请随意书写。当言语触及未知，它们会如烟般散去..."></textarea>
            <div class="archive-controls">
                <button id="manual-archive-btn">↓ 归档当前段落</button>
            </div>
            <div id="archive-wall"></div>
        </main>
    </div>

    <audio id="bg-audio-player" loop></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ================= DOM 节点 =================
            const textarea = document.getElementById('zen-input');
            const archiveWall = document.getElementById('archive-wall');
            const themeSelector = document.getElementById('theme-selector');
            const downloadBtn = document.getElementById('download-btn');
            const manualArchiveBtn = document.getElementById('manual-archive-btn');
            const autoArchiveToggle = document.getElementById('auto-archive-toggle');
            const animationToggle = document.getElementById('animation-toggle');
            const timestampToggle = document.getElementById('timestamp-toggle');
            const fxLayer = document.getElementById('fx-layer');
            const pageSelector = document.getElementById('page-selector');
            const newPageBtn = document.getElementById('new-page-btn');
            
            const audioSelector = document.getElementById('audio-selector');
            const playAudioBtn = document.getElementById('play-audio-btn');
            const bgAudioPlayer = document.getElementById('bg-audio-player');
            const localMusicInput = document.getElementById('local-music-input');

            // ================= 状态管理 (微型数据库) =================
            let appState = {
                pages: {}, // 存储所有书页的数据
                activeId: null // 当前正在编辑的书页 ID
            };

            // 创建新书页的工厂函数
            function createPage(name) {
                const id = 'page_' + Date.now();
                appState.pages[id] = {
                    id: id,
                    name: name,
                    draft: '', // 当前文本框未归档的内容
                    fragments: [], // 已归档片段
                    theme: 'theme-light',
                    audio: 'none',
                    audioSrcBlob: null, // 存储本地导入音乐的 Blob URL
                    isAudioPlaying: false,
                    animOn: true,
                    autoOn: true,
                    timeOn: true,
                    currentThreshold: getRandomThreshold() // 专属字数盲盒
                };
                return id;
            }

            // ================= 书页切换逻辑 =================
            function initBook() {
                const firstPageId = createPage('初始篇章');
                appState.activeId = firstPageId;
                updatePageDropdown();
                loadPageToUI(firstPageId);
            }

            function updatePageDropdown() {
                pageSelector.innerHTML = '';
                for (let id in appState.pages) {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = appState.pages[id].name;
                    pageSelector.appendChild(option);
                }
                pageSelector.value = appState.activeId;
            }

            // 将当前状态保存到数据结构中
            function saveCurrentPage() {
                if (!appState.activeId) return;
                const p = appState.pages[appState.activeId];
                p.draft = textarea.value;
                p.theme = themeSelector.value;
                p.audio = audioSelector.value;
                p.isAudioPlaying = !bgAudioPlayer.paused && audioSelector.value !== 'none';
                p.animOn = animationToggle.checked;
                p.autoOn = autoArchiveToggle.checked;
                p.timeOn = timestampToggle.checked;
            }

            // 切换并加载目标书页到界面
            function loadPageToUI(targetId) {
                const p = appState.pages[targetId];
                if (!p) return;
                
                // 1. 恢复文本和墙
                textarea.value = p.draft;
                archiveWall.innerHTML = '';
                // 倒序插入，保持最新的在最上面
                const reversedFragments = [...p.fragments].reverse();
                reversedFragments.forEach(item => {
                    renderFragmentToWall(item.text, item.time);
                });

                // 2. 恢复控件状态
                themeSelector.value = p.theme;
                audioSelector.value = p.audio;
                animationToggle.checked = p.animOn;
                autoArchiveToggle.checked = p.autoOn;
                timestampToggle.checked = p.timeOn;

                // 3. 应用环境与视觉
                applyTheme(p.theme, p.animOn);
                updateManualBtnVisibility();
                applyTimestampVisibility();

                // 4. 处理独立音频
                bgAudioPlayer.pause(); // 先停掉上一个页面的声音
                if (p.audio === 'import-local' && p.audioSrcBlob) {
                    bgAudioPlayer.src = p.audioSrcBlob;
                } else if (p.audio === 'custom-rain') {
                    bgAudioPlayer.src = 'rain.mp3';
                } else if (p.audio === 'custom-fire') {
                    bgAudioPlayer.src = 'fire.mp3';
                } else {
                    bgAudioPlayer.src = '';
                }
                
                if (p.isAudioPlaying && p.audio !== 'none') {
                    attemptPlayAudio();
                } else {
                    playAudioBtn.innerText = '播放环境音';
                }
            }

            // 新建书页事件
            newPageBtn.addEventListener('click', () => {
                let name = prompt("为新书页命名：", `书页 ${Object.keys(appState.pages).length + 1}`);
                if (name === null || name.trim() === '') return;
                
                saveCurrentPage(); // 离开前保存当前
                const newId = createPage(name.trim());
                appState.activeId = newId;
                updatePageDropdown();
                loadPageToUI(newId);
                textarea.focus();
            });

            // 切换书页事件
            pageSelector.addEventListener('change', (e) => {
                saveCurrentPage();
                appState.activeId = e.target.value;
                loadPageToUI(appState.activeId);
            });

            // ================= 基础逻辑辅助 =================
            function getLocalTime() {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            }

            function updateManualBtnVisibility() {
                manualArchiveBtn.style.display = autoArchiveToggle.checked ? 'none' : 'block';
            }

            function applyTimestampVisibility() {
                if (timestampToggle.checked) document.body.classList.remove('hide-timestamps');
                else document.body.classList.add('hide-timestamps');
            }

            // ================= 盲盒与打字逻辑 =================
            // 扩容字数盲盒 100 - 350 字
            function getRandomThreshold() { return Math.floor(Math.random() * (350 - 100 + 1)) + 100; }
            let isDissolving = false;
            let lastFxTime = 0;
            
            textarea.addEventListener('input', (e) => {
                if (isDissolving) return;
                const p = appState.pages[appState.activeId];

                const now = Date.now();
                if (animationToggle.checked && now - lastFxTime > 100) { 
                    triggerTypingEffect(themeSelector.value);
                    lastFxTime = now;
                }

                if (autoArchiveToggle.checked) {
                    if (e.target.value.length >= p.currentThreshold) {
                        executeArchiveAnimation(e.target.value);
                    }
                }
            });

            function executeArchiveAnimation(text) {
                isDissolving = true;
                textarea.disabled = true;
                textarea.classList.add('dissolving');

                setTimeout(() => {
                    archiveText(text);
                    textarea.value = '';
                    textarea.classList.remove('dissolving');
                    textarea.disabled = false;
                    textarea.focus();
                    isDissolving = false;
                    // 为当前书页刷新阈值
                    appState.pages[appState.activeId].currentThreshold = getRandomThreshold(); 
                }, 2400); 
            }

            manualArchiveBtn.addEventListener('click', () => {
                const text = textarea.value.trim();
                if (!text) return;
                executeArchiveAnimation(text);
            });

            function archiveText(text) {
                const currentTime = getLocalTime();
                const p = appState.pages[appState.activeId];
                // 存入当前书页的数据结构
                p.fragments.push({ text: text, time: currentTime });
                // 渲染到屏幕
                renderFragmentToWall(text, currentTime);
            }

            function renderFragmentToWall(text, time) {
                const el = document.createElement('div');
                el.className = 'fragment';
                el.innerHTML = `<span>${text.replace(/\n/g, '<br>')}</span><span class="timestamp">${time}</span>`;
                archiveWall.prepend(el);
                archiveWall.scrollTop = 0;
            }

            // ================= 动画视觉系统 =================
            function triggerTypingEffect(theme) {
                const el = document.createElement('div');
                if (theme === 'theme-light') {
                    el.className = 'fx-color-dot';
                    const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#1A535C', '#845EC2'];
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = el.style.height = `${Math.random() * 12 + 6}px`;
                    el.style.left = `${Math.random() * 90 + 5}vw`; el.style.top = `${Math.random() * 90 + 5}vh`;
                    fxLayer.appendChild(el); setTimeout(() => el.remove(), 2600);
                } 
                else if (theme === 'theme-botanical') {
                    if(Math.random() > 0.4) {
                        el.className = 'fx-leaf';
                        const greens = ['#5b7454', '#7c9c73', '#43583d', '#8ba881'];
                        el.style.background = greens[Math.floor(Math.random() * greens.length)];
                        el.style.width = el.style.height = `${Math.random() * 16 + 12}px`;
                        el.style.left = `${Math.random() * 90 + 5}vw`; el.style.top = `${Math.random() * 85 + 5}vh`;
                        if(Math.random() > 0.5) el.style.transform = 'scaleX(-1)'; 
                        fxLayer.appendChild(el); setTimeout(() => el.remove(), 3600);
                    }
                }
                else if (theme === 'theme-macondo') {
                    if(Math.random() > 0.4) {
                        el.className = 'fx-yellow-flower'; el.innerText = '✿'; el.style.color = '#d4af37';
                        el.style.left = `${Math.random() * 90 + 5}vw`; el.style.top = `${Math.random() * 70}vh`; 
                        el.style.animationDuration = `${Math.random() * 4 + 6}s`; 
                        fxLayer.appendChild(el); setTimeout(() => el.remove(), 10500);
                    }
                }
                else if (theme === 'theme-steppenwolf') {
                    el.className = 'fx-snow';
                    el.style.width = el.style.height = `${Math.random() * 6 + 3}px`;
                    el.style.left = `${Math.random() * 100}vw`; el.style.top = `-20px`; 
                    el.style.animationDuration = `${Math.random() * 5 + 6}s`; 
                    fxLayer.appendChild(el); setTimeout(() => el.remove(), 12000);
                }
            }

            function initDarkThemeStars() {
                for(let i=0; i<60; i++) {
                    const star = document.createElement('div');
                    star.className = 'fx-static-star';
                    star.style.width = star.style.height = `${Math.random() * 2 + 1}px`;
                    star.style.left = `${Math.random() * 100}vw`; star.style.top = `${Math.random() * 100}vh`;
                    star.style.animationDelay = `${Math.random() * 5}s`;
                    fxLayer.appendChild(star);
                }
            }

            function applyTheme(themeVal, animChecked) {
                document.body.className = themeVal;
                fxLayer.innerHTML = ''; 
                if (themeVal === 'theme-dark' && animChecked) initDarkThemeStars();
            }

            themeSelector.addEventListener('change', (e) => applyTheme(e.target.value, animationToggle.checked));
            animationToggle.addEventListener('change', (e) => applyTheme(themeSelector.value, e.target.checked));
            autoArchiveToggle.addEventListener('change', updateManualBtnVisibility);
            timestampToggle.addEventListener('change', applyTimestampVisibility);

            // ================= 音频管理 =================
            audioSelector.addEventListener('change', (e) => {
                const val = e.target.value;
                const p = appState.pages[appState.activeId];
                if (val === 'import-local') {
                    localMusicInput.click();
                    audioSelector.value = 'none'; 
                } else if (val === 'custom-rain') {
                    bgAudioPlayer.src = 'rain.mp3'; attemptPlayAudio();
                } else if (val === 'custom-fire') {
                    bgAudioPlayer.src = 'fire.mp3'; attemptPlayAudio();
                } else {
                    bgAudioPlayer.pause(); playAudioBtn.innerText = '播放环境音';
                }
            });

            localMusicInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    const p = appState.pages[appState.activeId];
                    if(p.audioSrcBlob) URL.revokeObjectURL(p.audioSrcBlob); // 释放旧内存
                    
                    const newBlob = URL.createObjectURL(e.target.files[0]);
                    p.audioSrcBlob = newBlob; // 存入当前书页状态
                    audioSelector.value = 'import-local'; // 手动更改选择器状态
                    bgAudioPlayer.src = newBlob; 
                    attemptPlayAudio();
                }
            });

            playAudioBtn.addEventListener('click', () => {
                if (audioSelector.value === 'none' && !bgAudioPlayer.src) return;
                if (bgAudioPlayer.paused) attemptPlayAudio(); 
                else { bgAudioPlayer.pause(); playAudioBtn.innerText = '播放环境音'; }
            });

            function attemptPlayAudio() {
                bgAudioPlayer.play().then(() => { playAudioBtn.innerText = '暂停环境音'; })
                .catch(err => {
                    alert("音频播放失败。请确保已允许浏览器自动播放，或你已将自定义音频(rain/fire)放入了文件夹。");
                    playAudioBtn.innerText = '播放环境音';
                });
            }

            // ================= 导出与清理逻辑 =================
            downloadBtn.addEventListener('click', () => {
                const p = appState.pages[appState.activeId];
                if (p.fragments.length === 0 && textarea.value.trim() === '') {
                    alert("当前书页还是空白的。"); return;
                }
                
                // 1. 弹出输入框让用户命名 (默认填充书页名)
                let customName = prompt("请为这封信命名：", p.name);
                if (customName === null) return; // 点击了“取消”
                customName = customName.trim() || p.name;
                
                // 如果当前文本框有没归档的文字，强行先归档进去，防止丢失
                if (textarea.value.trim() !== '') {
                    archiveText(textarea.value.trim());
                    textarea.value = '';
                }

                // 2. 构建下载内容
                const includeTime = timestampToggle.checked;
                const fileName = `${customName}_${getLocalTime().replace(/[: ]/g, '_')}.txt`;
                
                const lines = p.fragments.map(item => {
                    return includeTime ? `[${item.time}]\n${item.text}` : item.text;
                });
                const fileContent = lines.join('\n\n'); 
                
                // 3. 触发下载
                const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a'); 
                link.href = URL.createObjectURL(blob);
                link.download = fileName; 
                link.click(); 
                URL.revokeObjectURL(link.href);

                // 4. ✨ 核心：导出后彻底清空当前书页状态 ✨
                p.fragments = [];
                archiveWall.innerHTML = '';
                // 重新生成一个新的盲盒阈值，重新开始
                p.currentThreshold = getRandomThreshold();
            });

            // ================= 启动应用 =================
            initBook();
        });
    </script>
</body>
</html>
